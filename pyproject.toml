[project]
name = "jobhunter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guilherme Dórea Almeida", email = "119114807+GuilhermeDorea@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-ninja>=1.8.0",
    "google-genai>=3.1.0",
    "gunicorn>=27.0.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pypdf>=7.0.1",
    "whitenoise>=6.12.0",
]

[project.scripts]
jobhunter = "jobhunter:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.39.0",
]
